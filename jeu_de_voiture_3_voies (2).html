<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jeu de Voiture - 3 Voies</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@600;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #38b6ff;
            background-image: linear-gradient(180deg, #4ec0ca 0%, #71c5cf 72%, #ded895 72%, #d2c87e 100%);
            min-height: 100vh;
            margin: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .pixel-font {
            font-family: 'Press Start 2P', monospace;
        }

        /* Cadres style 2D Rétro (inspirés de Flappy Bird) */
        .retro-card {
            background-color: #ded895;
            border: 4px solid #543847;
            box-shadow: 0 5px 0 #543847;
            border-radius: 10px;
        }

        .retro-panel {
            background-color: #f8f6e8;
            border: 4px solid #543847;
            box-shadow: 0 6px 0 #543847;
            border-radius: 12px;
        }

        .retro-btn {
            border: 3px solid #543847;
            box-shadow: 0 4px 0 #543847;
            border-radius: 8px;
            transition: transform 0.06s, box-shadow 0.06s;
            cursor: pointer;
        }
        .retro-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #543847;
        }

        /* Canvas 2D responsive */
        canvas {
            display: block;
            width: 100%;
            max-width: 360px;
            height: auto;
            aspect-ratio: 360 / 540;
            border: 4px solid #543847;
            box-shadow: 0 6px 0 #543847;
            border-radius: 8px;
            background-color: #444648;
        }

        @keyframes shake {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(-7px, 4px); }
            40% { transform: translate(7px, -4px); }
            60% { transform: translate(-5px, -3px); }
            80% { transform: translate(5px, 3px); }
        }
        .shake-screen {
            animation: shake 0.4s ease-in-out;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-3 sm:p-5">

    <!-- TITRE DU JEU -->
    <header class="mb-3 text-center">
        <h1 class="pixel-font text-lg sm:text-2xl text-white tracking-wider" style="text-shadow: 3px 3px 0 #543847, -1px -1px 0 #543847;">
            TURBO ROUTE 3 VOIES
        </h1>
    </header>

    <!-- CONTENEUR PRINCIPAL : JEU À GAUCHE + INFOS & BOUTONS À DROITE -->
    <main class="w-full max-w-4xl flex flex-col md:flex-row items-center md:items-start justify-center gap-4 sm:gap-6">

        <!-- COLONNE GAUCHE : ZONE DU JEU (CANVAS 360x540) -->
        <div id="canvasContainer" class="relative w-full max-w-[360px] flex-shrink-0">
            <canvas id="gameCanvas" width="360" height="540"></canvas>

            <!-- ÉCRAN DE DÉPART (NOM DU JOUEUR + VITESSE) -->
            <div id="startOverlay" class="absolute inset-0 bg-black/55 rounded-[8px] flex flex-col items-center justify-center p-4 z-20">
                <div class="retro-card w-full p-4 text-center">
                    <h2 class="pixel-font text-xs sm:text-sm text-[#543847] mb-3">NOUVELLE COURSE</h2>

                    <label for="playerNameInput" class="block text-left text-xs font-extrabold text-[#543847] uppercase mb-1">
                        Nom du pilote :
                    </label>
                    <input type="text" id="playerNameInput" maxlength="12" placeholder="Ton prénom..."
                        class="w-full px-3 py-2 mb-3 bg-white border-3 border-[#543847] rounded-md font-bold text-[#543847] focus:outline-none">

                    <label class="block text-left text-xs font-extrabold text-[#543847] uppercase mb-1">
                        Vitesse de départ :
                    </label>
                    <div class="grid grid-cols-3 gap-1.5 mb-4">
                        <button type="button" data-speed="4" class="speed-choice retro-btn bg-[#84cc16] text-white font-extrabold text-xs py-2">
                            LENT
                        </button>
                        <button type="button" data-speed="6" class="speed-choice retro-btn bg-[#f59e0b] text-white font-extrabold text-xs py-2 ring-2 ring-[#543847]">
                            NORMAL
                        </button>
                        <button type="button" data-speed="8.5" class="speed-choice retro-btn bg-[#ef4444] text-white font-extrabold text-xs py-2">
                            RAPIDE
                        </button>
                    </div>

                    <button id="startBtn" class="retro-btn w-full bg-[#22c55e] hover:bg-[#16a34a] text-white pixel-font text-xs py-3.5">
                        ▶ JOUER
                    </button>
                </div>
            </div>

            <!-- ÉCRAN DE PAUSE -->
            <div id="pauseOverlay" class="hidden absolute inset-0 bg-black/60 rounded-[8px] flex flex-col items-center justify-center p-4 z-20">
                <div class="retro-card w-full p-5 text-center">
                    <div class="pixel-font text-base text-[#543847] mb-2">PAUSE</div>
                    <p class="text-xs font-bold text-[#735c43] mb-4">Le jeu est en pause.</p>
                    <button id="resumeBtn" class="retro-btn w-full bg-[#22c55e] text-white pixel-font text-xs py-3">
                        ▶ REPRENDRE
                    </button>
                </div>
            </div>

            <!-- ÉCRAN DE FIN DE PARTIE (APRÈS CRASH EN FEU) -->
            <div id="gameOverOverlay" class="hidden absolute inset-0 bg-black/65 rounded-[8px] flex flex-col items-center justify-center p-4 z-20">
                <div class="retro-card w-full p-4 text-center">
                    <div class="pixel-font text-sm text-[#dc2626] mb-1">CRASH !</div>
                    <div class="text-xs font-extrabold text-[#543847] mb-3">PARTIE TERMINÉE</div>

                    <div class="bg-[#f8f6e8] border-2 border-[#543847] rounded-lg p-3 mb-4 text-left space-y-1.5">
                        <div class="flex justify-between text-xs font-bold text-[#543847]">
                            <span>PILOTE :</span>
                            <span id="finalName" class="font-extrabold uppercase">JOUEUR</span>
                        </div>
                        <div class="flex justify-between text-xs font-bold text-[#543847]">
                            <span>SCORE FINAL :</span>
                            <span id="finalScore" class="pixel-font text-sm text-[#ea580c]">0</span>
                        </div>
                        <div class="flex justify-between text-xs font-bold text-[#543847]">
                            <span>RECORD :</span>
                            <span id="bestScoreDisplay" class="pixel-font text-xs text-[#16a34a]">0</span>
                        </div>
                    </div>

                    <button id="restartBtn" class="retro-btn w-full bg-[#f59e0b] hover:bg-[#d97706] text-white pixel-font text-xs py-3.5">
                        ↻ RECOMMENCER
                    </button>
                </div>
            </div>
        </div>

        <!-- COLONNE DROITE : INFORMATIONS DU JOUEUR + COMMANDES -->
        <aside class="w-full max-w-[360px] md:w-80 flex flex-col gap-3">

            <!-- CARTE INFOS : NOM, SCORE, VITESSE -->
            <div class="retro-panel p-4">
                <div class="flex items-center justify-between border-b-2 border-[#ded895] pb-2 mb-3">
                    <span class="text-xs font-extrabold text-[#735c43] uppercase">Pilote</span>
                    <span id="hudPlayerName" class="font-extrabold text-sm text-[#543847] uppercase">---</span>
                </div>

                <div class="grid grid-cols-2 gap-2.5 text-center">
                    <div class="retro-card p-2.5">
                        <div class="text-[11px] font-extrabold text-[#735c43] uppercase mb-1">Score</div>
                        <div id="scoreDisplay" class="pixel-font text-xl text-[#543847]">0</div>
                    </div>
                    <div class="retro-card p-2.5">
                        <div class="text-[11px] font-extrabold text-[#735c43] uppercase mb-1">Vitesse</div>
                        <div id="speedDisplay" class="pixel-font text-sm text-[#ea580c] pt-1">x1.0</div>
                    </div>
                </div>
            </div>

            <!-- ZONE DE MESSAGE EN DIRECT -->
            <div class="retro-card px-3 py-2.5 text-center">
                <p id="messageBox" class="text-xs font-extrabold text-[#543847]">
                    Entre ton nom et clique sur JOUER !
                </p>
            </div>

            <!-- BOUTONS DE CONTRÔLE DU JEU : PAUSE / ACCÉLÉRER / SON -->
            <div class="retro-panel p-3.5">
                <div class="text-[11px] font-extrabold text-[#735c43] uppercase mb-2">Options de course</div>
                <div class="grid grid-cols-3 gap-2">
                    <button id="pauseBtn" disabled class="retro-btn bg-[#facc15] disabled:opacity-40 text-[#543847] font-extrabold text-xs py-2.5 flex flex-col items-center justify-center">
                        <span class="text-sm">⏸</span>
                        <span>PAUSE</span>
                    </button>
                    <button id="boostBtn" disabled class="retro-btn bg-[#38bdf8] disabled:opacity-40 text-white font-extrabold text-xs py-2.5 flex flex-col items-center justify-center">
                        <span class="text-sm">⚡</span>
                        <span>VITESSE+</span>
                    </button>
                    <button id="muteBtn" class="retro-btn bg-[#a8a29e] text-white font-extrabold text-xs py-2.5 flex flex-col items-center justify-center">
                        <span id="muteIcon" class="text-sm">🔊</span>
                        <span id="muteLabel">SON ON</span>
                    </button>
                </div>
            </div>

            <!-- BOUTONS DE DIRECTION GAUCHE / DROITE (CLAVIER + TACTILE) -->
            <div class="retro-panel p-3.5">
                <div class="text-[11px] font-extrabold text-[#735c43] uppercase mb-2">Direction (Clavier ◀ ▶ ou Clic)</div>
                <div class="grid grid-cols-2 gap-3">
                    <button id="leftBtn" class="retro-btn bg-[#ef4444] hover:bg-[#dc2626] text-white font-extrabold py-4 text-base flex items-center justify-center gap-2">
                        <span>◀</span>
                        <span>GAUCHE</span>
                    </button>
                    <button id="rightBtn" class="retro-btn bg-[#ef4444] hover:bg-[#dc2626] text-white font-extrabold py-4 text-base flex items-center justify-center gap-2">
                        <span>DROITE</span>
                        <span>▶</span>
                    </button>
                </div>
            </div>

        </aside>
    </main>

    <script>
        /**
         * ============================================================================
         * 1. RÉCUPÉRATION DES ÉLÉMENTS HTML ET DU CANVAS 2D
         * ============================================================================
         */
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const canvasContainer = document.getElementById("canvasContainer");

        // Écrans superposés
        const startOverlay = document.getElementById("startOverlay");
        const pauseOverlay = document.getElementById("pauseOverlay");
        const gameOverOverlay = document.getElementById("gameOverOverlay");

        // Entrées et boutons
        const playerNameInput = document.getElementById("playerNameInput");
        const speedChoiceBtns = document.querySelectorAll(".speed-choice");
        const startBtn = document.getElementById("startBtn");
        const resumeBtn = document.getElementById("resumeBtn");
        const restartBtn = document.getElementById("restartBtn");

        const pauseBtn = document.getElementById("pauseBtn");
        const boostBtn = document.getElementById("boostBtn");
        const muteBtn = document.getElementById("muteBtn");
        const muteIcon = document.getElementById("muteIcon");
        const muteLabel = document.getElementById("muteLabel");

        const leftBtn = document.getElementById("leftBtn");
        const rightBtn = document.getElementById("rightBtn");

        // Affichages HUD à droite
        const hudPlayerName = document.getElementById("hudPlayerName");
        const scoreDisplay = document.getElementById("scoreDisplay");
        const speedDisplay = document.getElementById("speedDisplay");
        const messageBox = document.getElementById("messageBox");
        const finalName = document.getElementById("finalName");
        const finalScore = document.getElementById("finalScore");
        const bestScoreDisplay = document.getElementById("bestScoreDisplay");

        /**
         * ============================================================================
         * 2. MOTEUR AUDIO (BRUIT DE ROUTE/MOTEUR + EXPLOSION AU CRASH)
         * ============================================================================
         */
        let audioCtx = null;
        let engineOsc = null;
        let engineGain = null;
        let isMuted = false;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === "suspended") {
                audioCtx.resume();
            }
        }

        function startEngineSound() {
            if (isMuted) return;
            initAudio();
            stopEngineSound();

            engineOsc = audioCtx.createOscillator();
            engineGain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();

            engineOsc.type = "sawtooth";
            engineOsc.frequency.value = 52;
            filter.type = "lowpass";
            filter.frequency.value = 170;

            engineGain.gain.value = 0.055;

            engineOsc.connect(filter);
            filter.connect(engineGain);
            engineGain.connect(audioCtx.destination);
            engineOsc.start();
        }

        function updateEnginePitch(speed) {
            if (engineOsc && audioCtx && !isMuted) {
                engineOsc.frequency.setTargetAtTime(45 + speed * 5.5, audioCtx.currentTime, 0.1);
            }
        }

        function stopEngineSound() {
            if (engineOsc) {
                try { engineOsc.stop(); } catch (e) {}
                engineOsc.disconnect();
                engineOsc = null;
            }
        }

        function playCrashSound() {
            stopEngineSound();
            if (isMuted) return;
            initAudio();

            // Bruit blanc d'explosion + basse percutante
            const bufferSize = audioCtx.sampleRate * 0.7;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.2));
            }

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = "lowpass";
            filter.frequency.setValueAtTime(750, audioCtx.currentTime);
            filter.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.65);

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.65);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            noise.start();
        }

        function playPointSound() {
            if (isMuted) return;
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "triangle";
            osc.frequency.setValueAtTime(520, audioCtx.currentTime);
            osc.frequency.setValueAtTime(780, audioCtx.currentTime + 0.07);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.18);
        }

        /**
         * ============================================================================
         * 3. CHARGEMENT DES IMAGES (TES FICHIERS IMAGES/ + FALLBACK IDENTIQUE)
         * ============================================================================
         */
        function svgToImage(svg) {
            const img = new Image();
            img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
            return img;
        }

        // Route fidèle à piste.png (herbe, buissons, rochers, bordures blanches, asphalte)
        const roadImg = svgToImage(`
            <svg xmlns="http://www.w3.org/2000/svg" width="360" height="540" viewBox="0 0 360 540">
                <rect x="0" y="0" width="52" height="540" fill="#63a31e"/>
                <rect x="308" y="0" width="52" height="540" fill="#63a31e"/>
                <rect x="52" y="0" width="256" height="540" fill="#444648"/>
                <rect x="56" y="0" width="5" height="540" fill="#ffffff"/>
                <rect x="299" y="0" width="5" height="540" fill="#ffffff"/>
                <!-- Buissons et rochers -->
                <circle cx="22" cy="45" r="20" fill="#3f7d12"/><circle cx="19" cy="42" r="14" fill="#76c425"/>
                <ellipse cx="24" cy="125" rx="13" ry="10" fill="#7d8287"/>
                <circle cx="18" cy="220" r="22" fill="#3f7d12"/><circle cx="15" cy="217" r="15" fill="#76c425"/>
                <ellipse cx="22" cy="325" rx="11" ry="8" fill="#7d8287"/>
                <circle cx="20" cy="420" r="21" fill="#3f7d12"/><circle cx="17" cy="417" r="14" fill="#76c425"/>
                <circle cx="338" cy="60" r="21" fill="#3f7d12"/><circle cx="335" cy="57" r="14" fill="#76c425"/>
                <ellipse cx="336" cy="165" rx="12" ry="9" fill="#7d8287"/>
                <circle cx="340" cy="260" r="22" fill="#3f7d12"/><circle cx="337" cy="257" r="15" fill="#76c425"/>
                <ellipse cx="336" cy="370" rx="12" ry="9" fill="#7d8287"/>
                <circle cx="338" cy="460" r="20" fill="#3f7d12"/><circle cx="335" cy="457" r="14" fill="#76c425"/>
            </svg>
        `);

        // Si le fichier local images/piste.png existe dans ton dossier, on l'utilise directement
        const localRoad = new Image();
        localRoad.src = "images/piste.png";
        localRoad.onload = () => { roadImg.src = localRoad.src; drawScene(); };

        // Fonction créant le visuel exact de tes voitures (bandes blanches, rétroviseurs, pare-brise)
        function makeCarSprite(bodyColor, darkColor, rotate180) {
            return svgToImage(`
                <svg xmlns="http://www.w3.org/2000/svg" width="90" height="160" viewBox="0 0 90 160">
                    <g transform="${rotate180 ? 'rotate(180 45 80)' : ''}">
                        <rect x="9" y="28" width="8" height="26" rx="4" fill="#18181b"/>
                        <rect x="73" y="28" width="8" height="26" rx="4" fill="#18181b"/>
                        <rect x="9" y="104" width="8" height="26" rx="4" fill="#18181b"/>
                        <rect x="73" y="104" width="8" height="26" rx="4" fill="#18181b"/>
                        <path d="M14,56 L3,61 L7,67 L15,63 Z" fill="${bodyColor}" stroke="#18181b" stroke-width="1.5"/>
                        <path d="M76,56 L87,61 L83,67 L75,63 Z" fill="${bodyColor}" stroke="#18181b" stroke-width="1.5"/>
                        <rect x="14" y="8" width="62" height="142" rx="24" fill="${bodyColor}" stroke="${darkColor}" stroke-width="3"/>
                        <rect x="36" y="10" width="7" height="138" fill="#ffffff"/>
                        <rect x="47" y="10" width="7" height="138" fill="#ffffff"/>
                        <path d="M20,24 Q24,13 33,14 Q30,24 20,27 Z" fill="#f8fafc"/>
                        <path d="M70,24 Q66,13 57,14 Q60,24 70,27 Z" fill="#f8fafc"/>
                        <path d="M20,48 Q45,38 70,48 L65,68 Q45,62 25,68 Z" fill="#1e293b"/>
                        <path d="M24,104 Q45,109 66,104 L68,123 Q45,130 22,123 Z" fill="#1e293b"/>
                        <path d="M20,136 Q28,142 35,141 L33,146 Q23,146 19,140 Z" fill="#ef4444"/>
                        <path d="M70,136 Q62,142 55,141 L57,146 Q67,146 71,140 Z" fill="#ef4444"/>
                    </g>
                </svg>
            `);
        }

        // Voiture rouge du joueur
        const playerImg = makeCarSprite("#ef4444", "#991b1b", false);
        const localPlayer = new Image();
        localPlayer.src = "images/voiture-rouge.png";
        localPlayer.onload = () => { playerImg.src = localPlayer.src; drawScene(); };

        // Voitures adverses (bleue, jaune, verte)
        const enemyCars = [
            { img: makeCarSprite("#2563eb", "#1e3a8a", true), file: "images/voiture-bleu.png", w: 54, h: 94 },
            { img: makeCarSprite("#facc15", "#a16207", true), file: "images/voiture-jaune.png", w: 54, h: 94 },
            { img: makeCarSprite("#65a30d", "#365314", true), file: "images/voiture-verte.png", w: 54, h: 94 }
        ];
        enemyCars.forEach(car => {
            const img = new Image();
            img.src = car.file;
            img.onload = () => { car.img = img; };
        });

        // Vrais obstacles supplémentaires débloqués à partir de 100 points
        const barrierImg = svgToImage(`
            <svg xmlns="http://www.w3.org/2000/svg" width="80" height="40" viewBox="0 0 80 40">
                <rect x="6" y="28" width="10" height="10" fill="#334155"/>
                <rect x="64" y="28" width="10" height="10" fill="#334155"/>
                <rect x="2" y="8" width="76" height="20" rx="4" fill="#ef4444" stroke="#1e293b" stroke-width="2.5"/>
                <polygon points="14,8 26,8 18,28 6,28" fill="#ffffff"/>
                <polygon points="38,8 50,8 42,28 30,28" fill="#ffffff"/>
                <polygon points="62,8 74,8 66,28 54,28" fill="#ffffff"/>
                <circle cx="12" cy="5" r="4.5" fill="#facc15" stroke="#1e293b" stroke-width="1.5"/>
                <circle cx="68" cy="5" r="4.5" fill="#facc15" stroke="#1e293b" stroke-width="1.5"/>
            </svg>
        `);

        const conesImg = svgToImage(`
            <svg xmlns="http://www.w3.org/2000/svg" width="76" height="40" viewBox="0 0 76 40">
                <g transform="translate(4,4)">
                    <rect x="2" y="26" width="26" height="6" rx="2" fill="#ea580c" stroke="#1e293b" stroke-width="2"/>
                    <polygon points="15,2 6,26 24,26" fill="#f97316" stroke="#1e293b" stroke-width="2"/>
                    <polygon points="12,11 18,11 20,17 10,17" fill="#ffffff"/>
                </g>
                <g transform="translate(42,4)">
                    <rect x="2" y="26" width="26" height="6" rx="2" fill="#ea580c" stroke="#1e293b" stroke-width="2"/>
                    <polygon points="15,2 6,26 24,26" fill="#f97316" stroke="#1e293b" stroke-width="2"/>
                    <polygon points="12,11 18,11 20,17 10,17" fill="#ffffff"/>
                </g>
            </svg>
        `);

        const specialObstacles = [
            { img: barrierImg, w: 72, h: 36 },
            { img: conesImg, w: 68, h: 36 }
        ];

        /**
         * ============================================================================
         * 4. PARAMÈTRES DES 3 VOIES ET ÉTAT DU JEU
         * ============================================================================
         */
        const ROAD_LEFT = 54;
        const ROAD_WIDTH = canvas.width - (ROAD_LEFT * 2); // 252px
        const LANE_COUNT = 3;
        const LANE_WIDTH = ROAD_WIDTH / LANE_COUNT; // 84px par voie

        let gameState = "START"; // START, PLAYING, PAUSED, CRASHING, GAMEOVER
        let animationId = null;

        let playerName = "PILOTE";
        let score = 0;
        let bestScore = parseInt(localStorage.getItem("turbo_route_best") || "0", 10);
        let selectedStartSpeed = 6;
        let currentSpeed = 6;
        let roadScrollY = 0;

        // Voiture du joueur (voie centrale = 1)
        const player = {
            lane: 1,
            width: 54,
            height: 94,
            x: 0,
            y: canvas.height - 110
        };

        // Liste des obstacles actifs
        let obstacles = [];
        // Particules de feu et fumée lors du crash
        let fireParticles = [];
        let crashTimer = 0;

        // Calcule la position X centrée dans une voie (0, 1 ou 2)
        function getLaneCenterX(laneIndex, objWidth) {
            return ROAD_LEFT + (laneIndex * LANE_WIDTH) + (LANE_WIDTH - objWidth) / 2;
        }

        player.x = getLaneCenterX(player.lane, player.width);

        /**
         * ============================================================================
         * 5. GESTION DES OBSTACLES ET DES COLLISIONS
         * ============================================================================
         */
        function spawnObstacle(offsetY = -110, avoidLane = -1) {
            let lane = Math.floor(Math.random() * 3);
            if (lane === avoidLane) {
                lane = (lane + 1) % 3;
            }

            // Dès 100 points, mélange voitures adverses et vrais obstacles de chantier
            let choice;
            if (score >= 100 && Math.random() < 0.45) {
                choice = specialObstacles[Math.floor(Math.random() * specialObstacles.length)];
            } else {
                choice = enemyCars[Math.floor(Math.random() * enemyCars.length)];
            }

            return {
                lane: lane,
                x: getLaneCenterX(lane, choice.w),
                y: offsetY,
                width: choice.w,
                height: choice.h,
                img: choice.img
            };
        }

        function checkCollision(rectA, rectB) {
            const pad = 7; // Tolérance légère pour que la collision soit juste
            return !(
                rectA.x + rectA.width - pad < rectB.x + pad ||
                rectA.x + pad > rectB.x + rectB.width - pad ||
                rectA.y + rectA.height - pad < rectB.y + pad ||
                rectA.y + pad > rectB.y + rectB.height - pad
            );
        }

        /**
         * ============================================================================
         * 6. EFFET VISUEL DE CRASH EN FEU
         * ============================================================================
         */
        function createFireParticles(cx, cy) {
            const colors = ["#fef08a", "#f97316", "#ef4444", "#dc2626", "#334155"];
            for (let i = 0; i < 6; i++) {
                fireParticles.push({
                    x: cx + (Math.random() - 0.5) * 44,
                    y: cy + (Math.random() - 0.5) * 55,
                    vx: (Math.random() - 0.5) * 2.5,
                    vy: -1.5 - Math.random() * 3,
                    radius: 7 + Math.random() * 11,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    life: 1.0
                });
            }
        }

        function updateAndDrawFire() {
            for (let i = fireParticles.length - 1; i >= 0; i--) {
                const p = fireParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.035;
                p.radius *= 0.97;

                if (p.life <= 0) {
                    fireParticles.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        /**
         * ============================================================================
         * 7. DESSIN DE LA SCÈNE (ROUTE + 3 VOIES + VOITURES + FEU)
         * ============================================================================
         */
        function drawRoad() {
            const isZone100 = score >= 100;
            const yOffset = roadScrollY % canvas.height;

            // Image de piste qui défile en continu
            ctx.drawImage(roadImg, 0, yOffset - canvas.height, canvas.width, canvas.height);
            ctx.drawImage(roadImg, 0, yOffset, canvas.width, canvas.height);

            // Ambiance chantier dès 100 points
            if (isZone100) {
                ctx.fillStyle = "rgba(250, 204, 21, 0.14)";
                ctx.fillRect(ROAD_LEFT, 0, ROAD_WIDTH, canvas.height);
            }

            // Lignes pointillées délimitant les 3 voies
            ctx.fillStyle = isZone100 ? "#facc15" : "#ffffff";
            const dashH = 34;
            const gapH = 26;
            const step = dashH + gapH;
            const startY = (roadScrollY % step) - step;

            for (let lane = 1; lane < LANE_COUNT; lane++) {
                const x = ROAD_LEFT + lane * LANE_WIDTH - 3;
                for (let y = startY; y < canvas.height; y += step) {
                    ctx.fillRect(x, y, 6, dashH);
                }
            }
        }

        function drawScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawRoad();

            // Dessiner les obstacles
            obstacles.forEach(obs => {
                ctx.drawImage(obs.img, obs.x, obs.y, obs.width, obs.height);
            });

            // Dessiner la voiture rouge du joueur
            ctx.drawImage(playerImg, player.x, player.y, player.width, player.height);

            // Dessiner le feu en cas de crash
            if (gameState === "CRASHING" || gameState === "GAMEOVER") {
                updateAndDrawFire();
            }
        }

        /**
         * ============================================================================
         * 8. BOUCLE D'ANIMATION PRINCIPALE
         * ============================================================================
         */
        function updateHUD() {
            scoreDisplay.textContent = score;
            speedDisplay.textContent = "x" + (currentSpeed / 6).toFixed(1);
        }

        function gameLoop() {
            if (gameState === "PLAYING") {
                roadScrollY += currentSpeed;

                for (let i = 0; i < obstacles.length; i++) {
                    const obs = obstacles[i];
                    obs.y += currentSpeed;

                    // Vérification de collision
                    if (checkCollision(player, obs)) {
                        triggerCrash();
                        return;
                    }

                    // Obstacle évité avec succès
                    if (obs.y > canvas.height) {
                        score += 1;
                        playPointSound();

                        // Légère accélération naturelle avec le score
                        if (score % 10 === 0 && currentSpeed < 15) {
                            currentSpeed += 0.35;
                            updateEnginePitch(currentSpeed);
                        }

                        // À 100 points : passage au niveau supérieur avec vrais obstacles et 2 dangers !
                        if (score === 100) {
                            messageBox.textContent = "⚠️ 100 PTS ! ZONE D'OBSTACLES !";
                            if (obstacles.length < 2) {
                                obstacles.push(spawnObstacle(-360, obs.lane));
                            }
                        }

                        const otherLane = obstacles.length > 1 ? obstacles[1 - i].lane : -1;
                        obstacles[i] = spawnObstacle(-110, otherLane);
                        updateHUD();
                    }
                }

                drawScene();
                animationId = requestAnimationFrame(gameLoop);

            } else if (gameState === "CRASHING") {
                crashTimer++;
                createFireParticles(player.x + player.width / 2, player.y + player.height / 2);
                drawScene();

                if (crashTimer < 55) {
                    animationId = requestAnimationFrame(gameLoop);
                } else {
                    showGameOverScreen();
                }
            }
        }

        function triggerCrash() {
            gameState = "CRASHING";
            crashTimer = 0;
            playCrashSound();

            pauseBtn.disabled = true;
            boostBtn.disabled = true;
            messageBox.textContent = "💥 CRASH ! Ta voiture est en feu !";

            canvasContainer.classList.remove("shake-screen");
            void canvasContainer.offsetWidth;
            canvasContainer.classList.add("shake-screen");

            animationId = requestAnimationFrame(gameLoop);
        }

        function showGameOverScreen() {
            gameState = "GAMEOVER";
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem("turbo_route_best", bestScore);
            }

            finalName.textContent = playerName;
            finalScore.textContent = score;
            bestScoreDisplay.textContent = bestScore;
            gameOverOverlay.classList.remove("hidden");
        }

        /**
         * ============================================================================
         * 9. DÉMARRAGE, PAUSE, ACCÉLÉRATION ET CONTRÔLES (CLAVIER + BOUTONS)
         * ============================================================================
         */
        function startNewGame() {
            if (animationId) cancelAnimationFrame(animationId);

            const typedName = playerNameInput.value.trim();
            playerName = typedName !== "" ? typedName : "PILOTE";
            hudPlayerName.textContent = playerName;

            score = 0;
            currentSpeed = selectedStartSpeed;
            roadScrollY = 0;
            fireParticles = [];

            player.lane = 1;
            player.x = getLaneCenterX(player.lane, player.width);

            obstacles = [spawnObstacle(-120)];

            updateHUD();
            startOverlay.classList.add("hidden");
            pauseOverlay.classList.add("hidden");
            gameOverOverlay.classList.add("hidden");

            pauseBtn.disabled = false;
            boostBtn.disabled = false;
            messageBox.textContent = "Évite les véhicules ! Cap sur 100 pts !";

            gameState = "PLAYING";
            startEngineSound();
            animationId = requestAnimationFrame(gameLoop);
        }

        function togglePause() {
            if (gameState === "PLAYING") {
                gameState = "PAUSED";
                cancelAnimationFrame(animationId);
                stopEngineSound();
                pauseOverlay.classList.remove("hidden");
                messageBox.textContent = "⏸ Jeu en pause.";
            } else if (gameState === "PAUSED") {
                gameState = "PLAYING";
                pauseOverlay.classList.add("hidden");
                messageBox.textContent = "C'est reparti !";
                startEngineSound();
                updateEnginePitch(currentSpeed);
                animationId = requestAnimationFrame(gameLoop);
            }
        }

        function boostSpeed() {
            if (gameState !== "PLAYING") return;
            if (currentSpeed < 16) {
                currentSpeed += 1.2;
                updateHUD();
                updateEnginePitch(currentSpeed);
                messageBox.textContent = "⚡ Vitesse augmentée !";
            } else {
                messageBox.textContent = "🔥 Vitesse maximale atteinte !";
            }
        }

        function moveLeft() {
            if (gameState !== "PLAYING") return;
            if (player.lane > 0) {
                player.lane -= 1;
                player.x = getLaneCenterX(player.lane, player.width);
                drawScene();
            }
        }

        function moveRight() {
            if (gameState !== "PLAYING") return;
            if (player.lane < 2) {
                player.lane += 1;
                player.x = getLaneCenterX(player.lane, player.width);
                drawScene();
            }
        }

        // Sélection de la vitesse sur l'écran de départ
        speedChoiceBtns.forEach(btn => {
            btn.addEventListener("click", () => {
                speedChoiceBtns.forEach(b => b.classList.remove("ring-2", "ring-[#543847]"));
                btn.classList.add("ring-2", "ring-[#543847]");
                selectedStartSpeed = parseFloat(btn.dataset.speed);
            });
        });

        startBtn.addEventListener("click", startNewGame);
        restartBtn.addEventListener("click", startNewGame);
        pauseBtn.addEventListener("click", togglePause);
        resumeBtn.addEventListener("click", togglePause);
        boostBtn.addEventListener("click", boostSpeed);

        muteBtn.addEventListener("click", () => {
            isMuted = !isMuted;
            if (isMuted) {
                stopEngineSound();
                muteIcon.textContent = "🔇";
                muteLabel.textContent = "SON OFF";
            } else {
                muteIcon.textContent = "🔊";
                muteLabel.textContent = "SON ON";
                if (gameState === "PLAYING") startEngineSound();
            }
        });

        leftBtn.addEventListener("click", moveLeft);
        rightBtn.addEventListener("click", moveRight);

        // Contrôles clavier
        window.addEventListener("keydown", (e) => {
            if (document.activeElement === playerNameInput) {
                if (e.key === "Enter") startNewGame();
                return;
            }
            if (e.key === "ArrowLeft") {
                e.preventDefault();
                moveLeft();
            } else if (e.key === "ArrowRight") {
                e.preventDefault();
                moveRight();
            } else if (e.key === "ArrowUp") {
                e.preventDefault();
                boostSpeed();
            } else if (e.key === "p" || e.key === "P" || e.key === "Escape") {
                e.preventDefault();
                togglePause();
            }
        });

        // Dessin initial dès le chargement
        window.onload = function () {
            drawScene();
        };
    </script>
</body>
</html>
